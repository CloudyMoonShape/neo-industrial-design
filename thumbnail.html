<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 200px;width:1280px;height:854px}
.main{background:var(--ni-black);display:grid;place-items:center;position:relative}
.name{font-family:var(--font-display);font-weight:800;font-size:150px;line-height:.86;letter-spacing:-.02em;text-transform:uppercase;color:var(--ni-white);white-space:nowrap;text-align:center}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
</style></head><body>
<div class="tile"><div class="main"><div class="name">Neo Industrial</div></div>
<div class="strip"><div style="background:var(--ni-nvg)"></div><div style="background:var(--ni-hivis)"></div><div style="background:var(--ni-safety)"></div><div style="background:var(--ni-rust)"></div></div></div>
</body></html>
