<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--surface-primary);color:var(--text-primary)}
.row{display:flex;gap:8px}.col{display:grid;gap:8px}
.mono{font-family:var(--font-mono);font-size:var(--text-meta);letter-spacing:var(--track-stamp);text-transform:uppercase;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.sw{flex:1;border:var(--hairline) solid var(--border-strong);background:var(--surface-elevated)}
.chip{height:56px;border-bottom:var(--hairline) solid var(--border-default)}
.meta{padding:8px 10px;display:grid;gap:2px}.meta b{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--track-stamp);font-weight:500;color:var(--text-primary)}.meta i{font-style:normal;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--text-muted)}
</style></head><body data-atmos="fab"><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-primary)"></div><div class="meta"><b>--surface-primary</b><i>page</i></div></div><div class="sw"><div class="chip" style="background:var(--surface-elevated)"></div><div class="meta"><b>--surface-elevated</b><i>panel</i></div></div><div class="sw"><div class="chip" style="background:var(--surface-secondary)"></div><div class="meta"><b>--surface-secondary</b><i>raised</i></div></div><div class="sw"><div class="chip" style="background:var(--text-primary)"></div><div class="meta"><b>--text-primary</b><i>text</i></div></div><div class="sw"><div class="chip" style="background:var(--text-secondary)"></div><div class="meta"><b>--text-secondary</b><i>secondary</i></div></div><div class="sw"><div class="chip" style="background:var(--text-muted)"></div><div class="meta"><b>--text-muted</b><i>muted</i></div></div><div class="sw"><div class="chip" style="background:var(--signal-primary)"></div><div class="meta"><b>--signal-primary</b><i>accent / cta</i></div></div><div class="sw"><div class="chip" style="background:var(--signal-active)"></div><div class="meta"><b>--signal-active</b><i>online</i></div></div><div class="sw"><div class="chip" style="background:var(--signal-warn)"></div><div class="meta"><b>--signal-warn</b><i>degraded</i></div></div><div class="sw"><div class="chip" style="background:var(--signal-alert)"></div><div class="meta"><b>--signal-alert</b><i>alert</i></div></div></div></body></html>
