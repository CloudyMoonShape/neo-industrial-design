<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--surface-primary);color:var(--text-primary)}
.row{display:flex;gap:8px}.col{display:grid;gap:8px}
.mono{font-family:var(--font-mono);font-size:var(--text-meta);letter-spacing:var(--track-stamp);text-transform:uppercase;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.sw{flex:1;border:var(--hairline) solid var(--border-strong);background:var(--surface-elevated)}
.chip{height:56px;border-bottom:var(--hairline) solid var(--border-default)}
.meta{padding:8px 10px;display:grid;gap:2px}.meta b{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--track-stamp);font-weight:500;color:var(--text-primary)}.meta i{font-style:normal;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--text-muted)}
</style></head><body><div style="display:flex;align-items:end;gap:12px;height:110px"><div style="display:grid;gap:6px;justify-items:center"><div style="width:6px;height:4px;background:var(--signal-primary)"></div><span class="mono" style="font-size:9px">4</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:6px;height:8px;background:var(--signal-primary)"></div><span class="mono" style="font-size:9px">8</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:6px;height:12px;background:var(--signal-primary)"></div><span class="mono" style="font-size:9px">12</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:8px;height:16px;background:var(--signal-primary)"></div><span class="mono" style="font-size:9px">16</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:12px;height:24px;background:var(--signal-primary)"></div><span class="mono" style="font-size:9px">24</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:16px;height:32px;background:var(--signal-primary)"></div><span class="mono" style="font-size:9px">32</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:24px;height:48px;background:var(--signal-primary)"></div><span class="mono" style="font-size:9px">48</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:32px;height:64px;background:var(--signal-primary)"></div><span class="mono" style="font-size:9px">64</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:48px;height:96px;background:var(--signal-primary)"></div><span class="mono" style="font-size:9px">96</span></div><div class="mono" style="margin-left:auto;align-self:start">--space-1 … --space-9</div></div></body></html>
