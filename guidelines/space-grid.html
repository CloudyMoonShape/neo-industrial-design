<!-- @dsCard group="Spacing" viewport="700x180" name="Visible grid" subtitle="48px major / 24px minor. The grid is a style element — show it under heroes, HUDs and plates." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--surface-primary);color:var(--text-primary)}
.row{display:flex;gap:8px}.col{display:grid;gap:8px}
.mono{font-family:var(--font-mono);font-size:var(--text-meta);letter-spacing:var(--track-stamp);text-transform:uppercase;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.sw{flex:1;border:var(--hairline) solid var(--border-strong);background:var(--surface-elevated)}
.chip{height:56px;border-bottom:var(--hairline) solid var(--border-default)}
.meta{padding:8px 10px;display:grid;gap:2px}.meta b{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--track-stamp);font-weight:500;color:var(--text-primary)}.meta i{font-style:normal;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--text-muted)}
</style></head><body><div style="height:148px;border:var(--hairline) solid var(--border-strong);position:relative;background-image:linear-gradient(to right,var(--border-strong) 1px,transparent 1px),linear-gradient(to bottom,var(--border-strong) 1px,transparent 1px),linear-gradient(to right,var(--border-default) 1px,transparent 1px),linear-gradient(to bottom,var(--border-default) 1px,transparent 1px);background-size:48px 48px,48px 48px,24px 24px,24px 24px"><span class="mono" style="position:absolute;right:10px;bottom:8px">--grid-major 48 · --grid-minor 24</span><span class="mono" style="position:absolute;left:10px;top:8px;color:var(--signal-primary)">Content width 1280</span></div></body></html>
