<!-- @dsCard group="Colors" viewport="700x150" name="Signal" subtitle="One accent per surface. Safety orange is the accent; everything else is a state." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--surface-primary);color:var(--text-primary)}
.row{display:flex;gap:8px}.col{display:grid;gap:8px}
.mono{font-family:var(--font-mono);font-size:var(--text-meta);letter-spacing:var(--track-stamp);text-transform:uppercase;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.sw{flex:1;border:var(--hairline) solid var(--border-strong);background:var(--surface-elevated)}
.chip{height:56px;border-bottom:var(--hairline) solid var(--border-default)}
.meta{padding:8px 10px;display:grid;gap:2px}.meta b{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--track-stamp);font-weight:500;color:var(--text-primary)}.meta i{font-style:normal;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--text-muted)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ni-safety)"></div><div class="meta"><b>--ni-safety</b><i>#FF4C00 · the accent</i></div></div><div class="sw"><div class="chip" style="background:var(--ni-safety-2)"></div><div class="meta"><b>--ni-safety-2</b><i>#FF7A18 · hover only</i></div></div><div class="sw"><div class="chip" style="background:var(--ni-rust)"></div><div class="meta"><b>--ni-rust</b><i>#B84312 · fab accent</i></div></div><div class="sw"><div class="chip" style="background:var(--ni-amber)"></div><div class="meta"><b>--ni-amber</b><i>#E39B24 · warn / meter</i></div></div><div class="sw"><div class="chip" style="background:var(--ni-hivis)"></div><div class="meta"><b>--ni-hivis</b><i>#F0C14B · print only</i></div></div><div class="sw"><div class="chip" style="background:var(--ni-nvg)"></div><div class="meta"><b>--ni-nvg</b><i>#9CFF6A · online</i></div></div><div class="sw"><div class="chip" style="background:var(--ni-alert)"></div><div class="meta"><b>--ni-alert</b><i>#FF2E2E · alert</i></div></div><div class="sw"><div class="chip" style="background:var(--ni-datum)"></div><div class="meta"><b>--ni-datum</b><i>#2E62F0 · datum only</i></div></div></div></body></html>
